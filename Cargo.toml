[package]
name = "sjvm"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
description = "Manage Java JDK installations via symlinks — fast, shell-agnostic, no daemon"
license = "MIT"
repository = "https://github.com/fefou/sjvm"
readme = "README.md"
keywords = ["java", "jdk", "version-manager", "symlink", "cli"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
ui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
bincode = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
ratatui = { version = "0.30.0", optional = true }
crossterm = { version = "0.29.0", optional = true }

[dev-dependencies]
pty-process = "0.5"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3

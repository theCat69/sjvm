[package]
name = "sjvm"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
walkdir = "2.5"
bincode = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
ratatui = "0.30.0"
crossterm = "0.29.0"

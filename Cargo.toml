[package]
name = "sjvm"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Manage Java JDK installations via symlinks — fast, shell-agnostic, no daemon"
license = "MIT"
repository = "https://github.com/fefou/sjvm"
readme = "README.md"
keywords = ["java", "jdk", "version-manager", "symlink", "cli"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
ui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
bincode = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
time = "0.3.47"  # security pin — forces patched version; see RUSTSEC-2026-0009 / CVE-2026-25727
ratatui = { version = "0.30.0", optional = true }
crossterm = { version = "0.29.0", optional = true }
flate2    = { version = "1.0",  default-features = false, features = ["rust_backend"] }
indicatif = { version = "0.17", default-features = false }
reqwest   = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2      = { version = "0.10", default-features = false }
tar       = { version = "=0.4.45", default-features = false }  # pinned: RUSTSEC-2026-0067 / RUSTSEC-2026-0068 — CVEs fixed in 0.4.45
zip       = { version = "=2.3.0", default-features = false, features = ["deflate"] }  # exact pin: CVE-2025-29787 — path traversal via symlink fixed in 2.3.0

[dev-dependencies]
pty-process = "0.5"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3

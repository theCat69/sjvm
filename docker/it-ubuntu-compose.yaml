name: it-ubuntu-sjvm

services:
  sjvm-it:
    tty: true
    stdin_open: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: com.fefoucorp/sjvm:1.0.0-SNAPSHOT
    container_name: sjvm-it-ubuntu 
    working_dir: /app
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../test-config:/home/rustuser/.config/sjvm
    command: sh -c "cargo test --all-features --test e2e test_setup -- --ignored && cargo test --all-features --test e2e -- --skip test_setup --ignored --test-threads=1"
    # command: sh -c "cargo test --test e2e -- --ignored --show-output && cargo test --test e2e -- --test-threads=1 --show-output"
